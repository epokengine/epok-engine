name: Release policy

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require develop as the source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "develop" ]; then
            echo "Only develop may open a pull request into release."
            exit 1
          fi

      - name: Check out the candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the repository dependencies
        run: bash ./tools/setup-linux.sh

      - name: Validate the release version
        shell: bash
        run: |
          git fetch origin release:refs/remotes/origin/release --tags
          python tools/versioning.py current
          if git tag --merged origin/release --list 'v*' | grep -q .; then
            python tools/versioning.py --repo "$GITHUB_WORKSPACE" \
              validate-release --base-ref origin/release
          else
            echo "No release tag exists yet; accepting the initial release version."
          fi

      - name: Run the Rust test suite
        run: cargo test --locked
